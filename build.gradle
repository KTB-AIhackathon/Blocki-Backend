plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.blocki'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	jjwtVersion = '0.12.6'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 로컬 개발 편의 설정: .env 파일이 있으면 읽어서 bootRun 실행 시 환경변수로 주입한다.
// 팀원들은 export 등을 따로 할 필요 없이 `./gradlew bootRun`만 실행하면 된다.
// (배포 환경은 .env를 쓰지 않고 실제 서버/CI의 환경변수를 그대로 사용한다.)
tasks.named('bootRun') {
	def envFile = rootProject.file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { rawLine ->
			def line = rawLine.trim()
			if (line.isEmpty() || line.startsWith('#')) {
				return
			}
			def separatorIndex = line.indexOf('=')
			if (separatorIndex <= 0) {
				return
			}
			def key = line.substring(0, separatorIndex).trim()
			def value = line.substring(separatorIndex + 1).trim()
			if (value.length() >= 2 && (
					(value.startsWith('"') && value.endsWith('"')) ||
					(value.startsWith("'") && value.endsWith("'"))
			)) {
				value = value.substring(1, value.length() - 1)
			}
			environment key, value
		}
	} else {
		logger.lifecycle('[.env 없음] .env.example을 복사해서 .env를 만들어주세요: cp .env.example .env')
	}
}
