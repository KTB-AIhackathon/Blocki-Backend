spring:
  application:
    name: blocki-backend
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blocki}
    username: ${DB_USERNAME:blocki}
    password: ${DB_PASSWORD:blocki}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 해커톤 단계 편의 설정. 운영 전환 시 Flyway/Liquibase 마이그레이션으로 교체할 것.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT access token 설정. secret은 배포 환경에서 반드시 환경변수(JWT_SECRET)로 주입할 것.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:5173}

github:
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/integrations/github/callback}
  scope: ${GITHUB_SCOPE:read:user}
  authorize-uri: ${GITHUB_AUTHORIZE_URI:https://github.com/login/oauth/authorize}
  token-uri: ${GITHUB_TOKEN_URI:https://github.com/login/oauth/access_token}

notion:
  client-id: ${NOTION_CLIENT_ID:}
  client-secret: ${NOTION_CLIENT_SECRET:}
  redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/notion/callback}
  authorize-uri: ${NOTION_AUTHORIZE_URI:https://api.notion.com/v1/oauth/authorize}
  token-uri: ${NOTION_TOKEN_URI:https://api.notion.com/v1/oauth/token}

# Blocki-AI는 AI_BASE_URL과 AI_INTERNAL_KEY가 모두 설정된 환경에서만 활성화된다.
# 문서 생성은 GitHub 저장소를 훑고 LLM을 호출하므로 분 단위로 걸린다.
# 이 값이 짧으면 워커가 정상 동작해도 읽기 타임아웃으로 job이 실패한다.
ai:
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
