spring:
  application:
    name: blocki-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blocki}
    username: ${DB_USERNAME:blocki}
    password: ${DB_PASSWORD:blocki}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 해커톤 단계 편의 설정. 운영 전환 시 Flyway/Liquibase 마이그레이션으로 교체할 것.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT access token 설정. secret은 배포 환경에서 반드시 환경변수(JWT_SECRET)로 주입할 것.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:5173}

# Blocki-AI는 AI_BASE_URL과 AI_INTERNAL_KEY가 모두 설정된 환경에서만 활성화된다.
ai:
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
